<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081c2d"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/ranking.css"><title>대회 순위 발표 · 블록 탈출 대회</title></head>
<body>

      <article class="winner winner-3" data-rank="3" aria-hidden="true"><div class="medal">3</div><strong class="winner-name">기록 없음</strong><span class="winner-score">-</span><div class="podium-base"><b>3</b></div></article>
