<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c2538"><meta name="description" content="지메타와 함께 폭탄을 피하고 코인을 모으며 배우는 5단계 블록 코딩 대회"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/home.css"><title>블록 탈출 대회</title></head>
<body>
<header class="home-header">
  <a class="home-brand" href="/" aria-label="블록 탈출 대회 메인"><span class="home-mark" aria-hidden="true">B</span><span>블록 탈출 대회</span></a>
  <nav class="header-actions" aria-label="주요 메뉴">
    <a class="header-link ranking-link" href="/ranking.html">대회 순위표</a>
    <a class="header-link" href="/game.html">경기장 입장</a>
  </nav>
</header>
<main>
  <section class="hero" aria-labelledby="heroTitle">
    <div class="hero-copy">
      <p class="hero-line"><span aria-hidden="true"></span> 생각하고, 놓고, 탈출하자!</p>
      <h1 id="heroTitle">블록으로 만드는<br><em>가장 빠른 탈출</em></h1>
      <p class="hero-description">위·아래·왼쪽·오른쪽과 반복 블록으로 지메타의 길을 설계하세요. 폭탄은 피하고, 코인은 챙기고, 다섯 개의 깃발까지!</p>
      <div class="hero-actions"><a class="start-button" href="/game.html"><span class="play-icon" aria-hidden="true"></span>대회 시작하기</a></div>
    </div>
    <div class="hero-visual" aria-label="출발선에 선 지메타">
      <div class="route-line" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <img src="/assets/gmeta-run-hd.png" alt="달릴 준비를 하는 지메타 캐릭터">
      <div class="flag-sign" aria-hidden="true"><span></span></div>
      <p>READY?</p>
    </div>
  </section>
  <section class="partner-strip" aria-label="기관 로고">
    <div class="partner-logos">
      <img src="/assets/partners/seodaemun-gu.png" alt="서대문구">
      <span aria-hidden="true"></span>
      <img src="/assets/partners/korea-youth-foundation.png" alt="한국청소년재단">
      <span aria-hidden="true"></span>
      <img src="/assets/partners/gmeta-career-network.jpg" alt="G-META 가재울청소년센터">
    </div>
  </section>
</main>
